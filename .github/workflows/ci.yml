name: Go CI with Dagger

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run checks with Dagger
        uses: dagger/dagger-for-github@v8.4.0
        with:
          version: "latest"
          verb: check
